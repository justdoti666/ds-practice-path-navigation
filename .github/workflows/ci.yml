name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装开发依赖（Pillow 仅画插图用）
        run: python -m pip install --upgrade pip pillow
      - name: 单测（22 条，含独立 oracle）
        run: python -m unittest discover -s tests -t . -v
      - name: 自检闸门（10 组断言，纯 headless）
        run: python main.py --check
      - name: 基准 + 噪声闸门（默认写 _smoke/，不污染仓库）
        run: python tools/bench.py --repeats 3 --pairs 2 --check-cv 30
